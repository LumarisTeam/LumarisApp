name: ios_club_app
description: "西建大iOS Club出品软件，包括教务系统数据查询，电费、饭卡、校车等校园服务内容"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.2.1+2026082823

environment:
  sdk: '>=3.5.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  http: ^1.6.0
  intl: ^0.20.2
  permission_handler: ^12.0.1
  flutter_local_notifications: ^21.0.0
  url_launcher: ^6.3.2
  android_intent_plus: ^6.0.0
  package_info_plus: ^9.0.0
  home_widget: ^0.9.0
  path_provider: ^2.1.5
  open_file: ^3.5.10
  html: ^0.15.6
  dio: ^5.9.0
  timezone: ^0.11.0
  flutter_svg: ^2.2.3
  numberpicker: ^2.1.2
  fl_chart: ^1.1.1
  archive: ^4.0.7
  workmanager: ^0.9.0+3
  window_manager: ^0.5.1
  tray_manager:
    path: third_party/tray_manager
  flutter_riverpod: ^2.6.1
  display_mode: ^0.0.2
  encrypt: ^5.0.3
  macos_ui: ^2.2.2
  file_picker: ^11.0.2
  flutter_markdown: ^0.7.7+1
  logger: ^2.5.0
  reorderable_grid_view: ^2.2.8
  flutter_secure_storage: ^10.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  go_router: ^17.2.2
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  webview_flutter: ^4.10.0
  smooth_corner: ^1.1.1
  cached_network_image: ^3.4.1
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  fake_async: any
  mockito: any
  build_runner: any
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.4
  leak_tracker: ^11.0.1
  leak_tracker_flutter_testing: ^3.0.10
  hive_generator: 2.0.1
  flutter_native_splash: ^2.4.7
  msix: ^3.16.12
  freezed: ^2.5.2

dependency_overrides:
  geolocator_android: 5.0.2
  path_provider_foundation: 2.5.1
  web: ^1.1.0
  window_manager: ^0.3.7

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true

  assets:
    - assets/icon.ico
    - assets/icon.webp
    - assets/iconfont/iconfont.json
    - assets/iconfont/iconfont.ttf
    - LICENSE

  fonts:
    - family: IconFont
      fonts:
        - asset: assets/iconfont/iconfont.ttf

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  macos:
    generate: true
    image_path: "assets/mac_icon.png"
  image_path: "assets/icon.png"  # 提供 1024x1024 原始图标
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon.png
  android: true
  ios: true
  color_dark: "#121212"
  image_dark: assets/icon.png
  web: true

msix_config:
  display_name: 光序
  msix_version: 1.2.1.0
  logo_path: .\windows\runner\resources\app_icon.ico
  publisher_display_name: LuckyFish
  identity_name: LuckyFish.iOSClubApp
  timestamp_url: http://timestamp.digicert.com  # 或尝试其他服务器
  publisher: CN=7B495662-F6FD-47E2-B578-E845127E5AE3
  capabilities: "runFullTrust"
