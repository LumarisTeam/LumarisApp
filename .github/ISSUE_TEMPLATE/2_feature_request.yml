name: '🌠 功能建议'
description: '为「光序」提出一个新功能或改进想法'
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法！把「想解决什么问题」说清楚，比只描述「想要什么功能」更容易被采纳。
        「光序」是西安建筑科技大学的校园助手，主要围绕教务系统数据与校园服务展开；范围太广的通用需求可能不适合放在这里。

  - type: dropdown
    attributes:
      label: '🧩 涉及模块'
      description: '这个建议主要和哪部分有关？可以多选；如果是全新功能，选「新模块」。'
      multiple: true
      options:
        - '登录 / 教务系统认证'
        - '课程 / 课表'
        - '成绩查询'
        - '考试安排'
        - '待办事项'
        - '电费查询'
        - '饭卡 / 支付记录'
        - '校园网流量'
        - '校车时刻'
        - '校园地图'
        - '培养方案'
        - '桌面小组件 / 实时活动'
        - '通知与提醒'
        - '设置 / 主题外观'
        - '多语言 / 文案'
        - '新模块'
        - '其他'
    validations:
      required: true

  - type: textarea
    attributes:
      label: '🥰 需求背景'
      description: 这个建议是为了解决什么问题？你现在是怎么绕过它的？
      placeholder: 我在……的时候总是很麻烦，因为……
    validations:
      required: true

  - type: textarea
    attributes:
      label: '🧐 期望的方案'
      description: 你希望我们怎么做？如果有交互或界面上的想法，可以贴草图。
    validations:
      required: true

  - type: textarea
    attributes:
      label: '🔎 数据来源'
      description: |
        如果这个功能需要新的数据，请说明数据从哪来（教务系统页面、学校官网、某个接口等）。
        只有学校提供的数据我们才拿得到，拿不到的数据做不了。
    validations:
      required: false

  - type: textarea
    attributes:
      label: '🔄 考虑过的其他方案'
      description: 你还想过哪些替代做法？为什么没有选它们？
    validations:
      required: false

  - type: textarea
    attributes:
      label: '📝 补充信息'
      description: 其他相关上下文、参考资料、别的学校同类 App 是怎么做的。
    validations:
      required: false

  - type: dropdown
    attributes:
      label: '🛠️ 是否愿意提交 PR 实现？'
      options:
        - '愿意，我可以提交 PR'
        - '不愿意，但我可以帮忙测试'
    validations:
      required: false

  - type: checkboxes
    attributes:
      label: '✅ 提交前确认'
      options:
        - label: 我已经搜索过 [已有 Issue](https://github.com/iOS-Club-XAUAT/ios_club_app/issues)，确认没有重复的建议。
          required: true
        - label: 这个建议符合「光序」的定位（西安建筑科技大学的校园助手），而不是偏离方向的定制需求。
          required: true
        - label: 我理解涉及学校教务系统的功能受学校系统能力限制，App 只能展示学校提供的数据。
          required: true
