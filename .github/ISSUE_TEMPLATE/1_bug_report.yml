name: '🐛 Bug 反馈'
description: '报告一个 Bug，帮助我们改进「光序」'
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间反馈问题！信息填得越完整，定位得越快。
        提交前请先搜索 [已有 Issue](https://github.com/iOS-Club-XAUAT/ios_club_app/issues)，避免重复。

        > ⚠️ **请勿粘贴学号、教务系统密码、一卡通卡号等个人信息**，日志和截图里的相关内容请先打码。
        > 如果只是使用上的疑问或吐槽，用 App 内「我的 → 意见反馈」会比开 Issue 更快。

  - type: dropdown
    attributes:
      label: '🧩 问题模块'
      description: '问题出在哪个功能上？可以多选；选项里没有就选「其他」，并在下面的问题描述里补充。'
      multiple: true
      options:
        - '登录 / 教务系统认证'
        - '课程 / 课表'
        - '成绩查询'
        - '考试安排'
        - '待办事项'
        - '电费查询'
        - '饭卡 / 支付记录'
        - '校园网流量'
        - '校车时刻'
        - '校园地图'
        - '培养方案'
        - '桌面小组件 / 实时活动'
        - '通知与提醒'
        - '设置 / 主题外观'
        - '多语言 / 文案'
        - '检查更新 / 安装'
        - '其他'
    validations:
      required: true

  - type: dropdown
    attributes:
      label: '📱 平台'
      description: '在哪些平台上遇到了这个问题？「光序」是跨平台的，同一问题可能只在个别平台出现。'
      multiple: true
      options:
        - 'Android'
        - 'iOS'
        - 'macOS'
        - 'Windows'
        - 'Linux'
        - 'Web（浏览器）'
    validations:
      required: true

  - type: input
    attributes:
      label: '📌 版本号'
      description: 'App 内「我的 → 设置/关于 → 版本」可以看到。'
      placeholder: '例如 1.2.1+2026090421'
    validations:
      required: true

  - type: input
    attributes:
      label: '💻 系统版本'
      description: '出问题的设备系统版本；桌面端请顺带写上设备型号。'
      placeholder: '例如 Android 14 / iOS 17.4 / Windows 11 23H2 / macOS 15.1'
    validations:
      required: true

  - type: dropdown
    attributes:
      label: '📦 安装来源'
      description: '你这份 App 是从哪里装的？不同分发渠道的版本可能不一样。'
      options:
        - 'Gitee 发行版（自行下载 APK 安装）'
        - '应用商店（App Store / Microsoft Store 等）'
        - '网页版（浏览器直接访问）'
        - '自己从源码构建'
        - '其他 / 记不清了'
    validations:
      required: false

  - type: textarea
    attributes:
      label: '🐛 问题描述'
      description: 清晰地描述你遇到的问题。如果上面的选项你选了「其他」，请在这里补充说明。
      placeholder: 我在做什么的时候，结果发生了什么……
    validations:
      required: true

  - type: textarea
    attributes:
      label: '📷 复现步骤'
      description: 一步一步写清楚怎么复现，能稳定复现的问题修复起来最快。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true

  - type: textarea
    attributes:
      label: '🚦 预期行为'
      description: 你期望它应该是什么表现？
    validations:
      required: false

  - type: textarea
    attributes:
      label: '📝 补充信息'
      description: |
        其他有助于定位的信息：报错日志（应用文档目录下的 app_errors.log）、截图 / 录屏、学校的通知原文等。
        提示：粘贴大段日志或代码时，请用 ``` 包裹起来；贴之前记得把学号、姓名、密码等信息打码。
    validations:
      required: false

  - type: dropdown
    attributes:
      label: '🛠️ 是否愿意提交 PR 修复？'
      options:
        - '愿意，我可以提交 PR'
        - '不愿意，但我可以帮忙测试修复效果'
    validations:
      required: false

  - type: checkboxes
    attributes:
      label: '✅ 提交前确认'
      description: 请确认以下事项，否则 Issue 可能会被直接关闭。
      options:
        - label: 我已经搜索过 [已有 Issue](https://github.com/iOS-Club-XAUAT/ios_club_app/issues)，确认没有重复。
          required: true
        - label: 我使用的是最新版本，问题依然存在。
          required: true
        - label: 这是一个可以复现的具体 Bug，而不是使用咨询或功能建议。
          required: true
        - label: 这个问题属于「光序」App 本身，而不是学校教务系统、第三方库或平台的问题。
          required: true
        - label: 我已确认内容中不含学号、密码、一卡通卡号等个人信息。
          required: true
