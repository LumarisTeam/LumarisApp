<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- 鲜艳的背景渐变，方便透射 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>

    <!-- 图标主体：高透明度白色，模拟玻璃 -->
    <linearGradient id="glassBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.2"/>
    </linearGradient>

    <!-- 锐利的边缘：纯白色描边 -->
    <linearGradient id="edgeStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.3"/>
    </linearGradient>
    
    <!-- 内部模糊滤镜：仅应用于图标内部，不产生外溢光晕 -->
    <filter id="internalBlur" x="0" y="0" width="100%" height="100%" filterUnits="objectBoundingBox">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" />
    </filter>
  </defs>

  <!-- 背景底色 -->
  <rect width="240" height="240" rx="54" fill="url(#bgGrad)"/>

  <!-- 日历图标 -->
  <g transform="translate(120,120) scale(6.2) translate(-12,-12)">
    <!-- 1. 磨砂玻璃层：填充颜色并应用滤镜 -->
    <path d="M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" 
          fill="url(#glassBody)" 
          filter="url(#internalBlur)"/>

    <!-- 2. 线条与细节：纯白描边，确保边缘锐利，不应用滤镜 -->
    <g fill="none" stroke="url(#edgeStroke)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <!-- 挂钩 -->
      <path d="M6.75 3v2.25M17.25 3v2.25" stroke="white" stroke-width="1.5" />
      <!-- 日历主体框架 -->
      <path d="M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"/>
      <!-- 网格点 -->
      <path d="M12 12.75h.008v.008H12v-.008ZM12 15h.008v.008H12V15Zm0 2.25h.008v.008H12v-.008ZM9.75 15h.008v.008H9.75V15Zm0 2.25h.008v.008H9.75v-.008ZM7.5 15h.008v.008H7.5V15Zm0 2.25h.008v.008H7.5v-.008ZM14.25 12.75h.008v.008h-.008v-.008ZM14.25 15h.008v.008h-.008V15ZM14.25 17.25h.008v.008h-.008v-.008ZM16.5 12.75h.008v.008H16.5v-.008ZM16.5 15h.008v.008H16.5V15Z" stroke-width="1.5" />
    </g>
  </g>
</svg>
